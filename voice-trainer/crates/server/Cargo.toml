[package]
name = "voice-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "voice-server"
path = "src/main.rs"

[dependencies]
axum       = { version = "0.7", features = ["multipart"] }
tokio      = { version = "1",   features = ["full"] }
tower-http = { version = "0.5", features = ["cors"] }
rusqlite   = { version = "0.31", features = ["bundled"] }
serde      = { version = "1",   features = ["derive"] }
serde_json = "1"
anyhow     = "1"
